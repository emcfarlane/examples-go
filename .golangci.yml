version: "2"
linters:
  default: all
  disable:
    # These three are superseded by their _v2/_v5 successors, which `default:
    # all` already enables. Disabling the originals avoids double-reporting.
    - exhaustruct     # replaced by exhaustruct_v5 in golangci v2.13
    - gomodguard      # replaced by gomodguard_v2 in golangci v2.12
    - wsl             # replaced by wsl_v5 in golangci v2.2
  settings:
    depguard:
      rules:
        all:
          files: ['$all']
          deny:
            - pkg: github.com/pkg/errors
              desc: use the standard library's errors package
            - pkg: go.uber.org/zap
              desc: use the standard library's log package
            - pkg: github.com/rs/zerolog
              desc: use the standard library's log package
            - pkg: github.com/sirupsen/logrus
              desc: use the standard library's log package
            - pkg: math/rand$
              desc: use math/rand/v2
    errcheck:
      check-type-assertions: true
    forbidigo:
      # Unlike most Buf projects, we're allowing the standard library's log
      # package: this is a demo service, so let's keep it simple. That's why
      # there's no '^log\.' pattern here.
      forbid:
        # Setting `forbid` at all replaces forbidigo's built-in defaults, so
        # restate them before adding to them.
        - pattern: '^(fmt\.Print(|f|ln)|print|println)$'
        # Don't panic in production code. Verified that nothing else among the
        # enabled linters catches this.
        - pattern: '^panic$'
  exclusions:
    rules:
      # There are a lot of globals that are technically mutable.
      - linters: [gochecknoglobals, goconst]
        path: internal/eliza/globals.go
      # These tests assert against eliza's unexported response tables, so they
      # live in the package under test rather than in an external test package.
      - linters: [testpackage]
        path: internal/eliza/eliza_test.go
formatters:
  enable:
    - gci     # preferred over goimports
    - gofmt   # preferred over gofumpt
  settings:
    gci:
      sections:
        - standard # Standard section: captures all standard packages.
        - default # Default section: contains all imports that could not be matched to another section type.
        - prefix(connect-examples-go) # Custom section: groups all imports with the specified Prefix.
